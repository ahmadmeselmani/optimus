name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to build (for example v0.1.0)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - name: Test
        run: go test -race ./...
      - name: Vet
        run: go vet ./...
      - name: Check Unix installer
        run: |
          sh -n install.sh
          bash -n scripts/build-release.sh
          python3 scripts/test_install.py
      - name: Build release archives
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: bash scripts/build-release.sh "$RELEASE_TAG"
      - name: Create draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          gh release create "$RELEASE_TAG" dist/optimus_*.tar.gz dist/optimus_*.zip \
            dist/checksums.txt dist/install.sh dist/install.ps1 \
            --verify-tag --draft --title "Optimus $RELEASE_TAG" --generate-notes
